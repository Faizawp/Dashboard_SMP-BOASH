<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VENSIX SMP BOASH</title>
  <!-- Google Fonts: Athletic Display & Clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap 5.3 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Chart.js & QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --navy-dark: #060e1b;
      --navy-primary: #0a192f;
      --navy-light: #112240;
      --electric-blue: #0084ff;
      --electric-cyan: #00c6ff;
      --gold-accent: #f59e0b;
      --gold-bright: #fbbf24;
      --surface-bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-subtle: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--surface-bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    h1, h2, h3, .font-athletic {
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* ================= NAVBAR PUBLIC ================= */
    .navbar-championship {
      background: rgba(6, 14, 27, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(245, 158, 11, 0.35);
      padding: 0.75rem 0;
    }

    .brand-emblem {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--electric-blue), var(--navy-primary));
      border: 2px solid var(--gold-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-bright);
      font-size: 1.3rem;
      box-shadow: 0 0 15px rgba(0, 132, 255, 0.35);
    }

    .nav-link-sport {
      color: #cbd5e1 !important;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.5rem 0.85rem !important;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .nav-link-sport:hover, .nav-link-sport.active {
      color: #ffffff !important;
      background: rgba(0, 132, 255, 0.18);
    }

    /* ================= HERO SECTION ================= */
    .hero-arena {
      background: radial-gradient(circle at 80% 20%, rgba(0, 132, 255, 0.25) 0%, transparent 50%),
                  linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-primary) 60%, var(--navy-light) 100%);
      color: #ffffff;
      padding: 4.5rem 0 4rem;
      position: relative;
      border-bottom: 4px solid var(--gold-accent);
    }

    .badge-organizer {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--gold-accent);
      color: var(--gold-bright);
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.4rem 0.9rem;
      border-radius: 50px;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .hero-title {
      font-size: clamp(2.6rem, 5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.02;
      margin-top: 1rem;
    }

    .hero-title span {
      color: var(--gold-bright);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-accent), #d97706);
      color: #060e1b;
      font-weight: 700;
      border: none;
      padding: 0.72rem 1.5rem;
      border-radius: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      color: #060e1b;
    }

    .btn-electric {
      background: var(--electric-blue);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 0.72rem 1.4rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-electric:hover {
      background: #006fe6;
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* ================= STAT CARDS & BRANCH CARDS ================= */
    .stat-ticker-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 14px rgba(10, 25, 47, 0.05);
      transition: transform 0.2s ease;
    }

    .stat-ticker-card:hover {
      transform: translateY(-3px);
    }

    .branch-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(10, 25, 47, 0.06);
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }

    .branch-card:hover {
      transform: translateY(-5px);
      border-color: var(--electric-blue);
      box-shadow: 0 14px 30px rgba(0, 132, 255, 0.12);
    }

    .branch-header {
      background: linear-gradient(135deg, var(--navy-primary), var(--navy-light));
      color: #ffffff;
      padding: 1.5rem;
      position: relative;
      border-bottom: 3px solid var(--gold-accent);
    }

    .branch-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(0, 132, 255, 0.2);
      border: 1px solid rgba(0, 198, 255, 0.4);
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 0.85rem;
    }

    /* ================= ADMIN DASHBOARD LAYOUT ================= */
    .admin-wrapper {
      display: flex;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 270px;
      background: var(--navy-dark);
      color: #e2e8f0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.25s ease;
      z-index: 1040;
    }

    .admin-sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--navy-primary);
    }

    .admin-menu-list {
      padding: 0.75rem;
      overflow-y: auto;
      flex-grow: 1;
      max-height: calc(100vh - 140px);
    }

    .admin-menu-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.62rem 0.9rem;
      border-radius: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .admin-menu-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }

    .admin-menu-item.active {
      background: linear-gradient(90deg, var(--electric-blue), #0066cc);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 132, 255, 0.3);
    }

    .admin-main {
      flex-grow: 1;
      background: var(--surface-bg);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .admin-topbar {
      background: #ffffff;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ================= TOURNAMENT DISPLAY MODE (?page=display) ================= */
    .display-arena {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #112240, #060e1b 70%);
      color: #ffffff;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
    }

    .display-panel {
      background: rgba(17, 34, 64, 0.75);
      border: 1px solid rgba(0, 132, 255, 0.35);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    /* ================= PHASE 2: PUBLIC PORTAL COMPONENTS ================= */
    .section-divider-title {
      border-left: 4px solid var(--gold-accent);
      padding-left: 0.85rem;
    }

    .match-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.15rem;
      transition: all 0.2s ease;
    }

    .match-card:hover {
      border-color: var(--electric-blue);
      box-shadow: 0 8px 20px rgba(10, 25, 47, 0.06);
    }

    .match-card.is-live {
      border-left: 4px solid #ef4444;
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.03), #ffffff 30%);
    }

    .score-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      background: var(--navy-primary);
      color: #ffffff;
      padding: 0.2rem 0.85rem;
      border-radius: 8px;
      min-width: 84px;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .score-pill.live-pill {
      background: #dc2626;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.35);
    }

    .filter-pill-btn {
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.42rem 1rem;
    }

    .standings-table th {
      background-color: var(--navy-primary) !important;
      color: #ffffff !important;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .announcement-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.35rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .announcement-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(10, 25, 47, 0.07);
    }

    @media (max-width: 991.98px) {
      .admin-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .admin-sidebar.show {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

  <!-- ROOT CONTAINER -->
  <div id="appRoot"></div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1090;"></div>

  <!-- MODAL: LOGIN STAFF / ADMIN / JURI -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
        <div class="modal-header text-white border-0" style="background: var(--navy-primary);">
          <div>
            <h5 class="modal-title font-athletic fs-4 mb-0">
              <i class="bi bi-shield-lock-fill text-warning me-2"></i>Portal Panitia & Dewan Juri
            </h5>
            <small class="text-light opacity-75">BOASH CHAMPIONSHIP HUB — SMP BOASH</small>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="loginForm" class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
              <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required />
            </div>
          </div>
          <div id="loginErrorAlert" class="alert alert-danger py-2 small d-none"></div>
          <button type="submit" id="btnLoginSubmit" class="btn btn-electric w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Dashboard
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: KONFIGURASI BACKEND API URL (PHASE 1 SETUP) -->
  <div class="modal fade" id="apiConfigModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
        <div class="modal-header text-white border-0" style="background: var(--navy-dark);">
          <h5 class="modal-title font-athletic fs-4 mb-0">
            <i class="bi bi-hdd-network text-info me-2"></i>Koneksi Backend Google Apps Script
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <p class="small text-muted">
            Tempelkan <strong>Web App URL</strong> hasil deployment Google Apps Script (<code>Code.gs</code>) agar frontend terhubung ke database Spreadsheet.
          </p>
          <div class="mb-3">
            <label class="form-label fw-semibold">Apps Script Web App URL</label>
            <input type="url" id="inputApiUrl" class="form-control font-monospace small"
                   placeholder="https://script.google.com/macros/s/.../exec" />
          </div>
          <div class="d-flex gap-2">
            <button type="button" id="btnSaveApiUrl" class="btn btn-electric flex-grow-1">
              <i class="bi bi-check-circle me-1"></i> Simpan & Uji Koneksi
            </button>
            <button type="button" id="btnRunInitDbPublic" class="btn btn-outline-warning fw-semibold">
              <i class="bi bi-database-add me-1"></i> Init 27 Sheet
            </button>
          </div>
          <div id="apiConfigStatus" class="mt-3 small"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: DETAIL PENGUMUMAN PUBLIK (PHASE 2) -->
  <div class="modal fade" id="announcementDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
        <div class="modal-header text-white border-0" style="background: var(--navy-primary);">
          <div>
            <span id="annModalBadge" class="badge bg-warning text-dark mb-1">UMUM</span>
            <h5 id="annModalTitle" class="modal-title font-athletic fs-3 mb-0">Judul Pengumuman</h5>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div id="annModalDate" class="small text-muted mb-3"></div>
          <div id="annModalBody" style="white-space: pre-line; line-height: 1.7;"></div>
        </div>
        <div class="modal-footer border-0 bg-light">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /**
     * ============================================================================
     * BOASH CHAMPIONSHIP HUB - FRONTEND CORE ARCHITECTURE (PHASE 1)
     * ============================================================================
     * Arsitektur Modular:
     * 1. AppConfig   : Konfigurasi terpusat & penyimpanan API URL
     * 2. Utils       : Sanitasi XSS, Toast, Format tanggal
     * 3. ApiClient   : Komunikasi JSON ke GAS Web App dengan timeout & error handling
     * 4. Store       : State terpusat (User, Role, Bootstrap Data, Active View)
     * 5. Views       : PublicPortalView, AdminDashboardView, DisplayModeView
     * ============================================================================
     */

    const AppConfig = {
      APP_NAME: "BOASH CHAMPIONSHIP HUB",
      ORGANIZER: "SMP BOASH",
      TAGLINE: "One Spirit, Three Competitions, One Champion!",
      // Ganti konstanta di bawah ini setelah Anda men-deploy Code.gs sebagai Web App:
      DEFAULT_API_URL: "",
      REQUEST_TIMEOUT_MS: 15000,
      STORAGE_KEYS: {
        API_URL: "bch_api_url",
        TOKEN: "bch_session_token",
        USER: "bch_user_profile"
      },
      getApiUrl() {
        return localStorage.getItem(this.STORAGE_KEYS.API_URL) || this.DEFAULT_API_URL;
      },
      setApiUrl(url) {
        localStorage.setItem(this.STORAGE_KEYS.API_URL, (url || "").trim());
      }
    };

    const Utils = {
      escapeHTML(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      },
      showToast(message, type = "primary") {
        const container = document.getElementById("toastContainer");
        const id = "toast_" + Date.now();
        const iconMap = {
          success: "bi-check-circle-fill",
          danger: "bi-exclamation-triangle-fill",
          warning: "bi-exclamation-circle-fill",
          primary: "bi-info-circle-fill"
        };
        const html = `
          <div id="${id}" class="toast align-items-center text-bg-${type} border-0 shadow" role="alert">
            <div class="d-flex">
              <div class="toast-body fw-medium">
                <i class="bi ${iconMap[type] || iconMap.primary} me-2"></i>${this.escapeHTML(message)}
              </div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
          </div>`;
        container.insertAdjacentHTML("beforeend", html);
        const el = document.getElementById(id);
        const toast = new bootstrap.Toast(el, { delay: 4000 });
        toast.show();
        el.addEventListener("hidden.bs.toast", () => el.remove());
      }
    };

    const ApiClient = {
      async request(action, payload = {}, useAuth = false) {
        const apiUrl = AppConfig.getApiUrl();
        if (!apiUrl) {
          return {
            success: false,
            code: 0,
            message: "URL Backend Google Apps Script belum diatur. Klik 'Konfigurasi API' untuk menghubungkan."
          };
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), AppConfig.REQUEST_TIMEOUT_MS);

        const body = {
          action: action,
          token: useAuth ? (localStorage.getItem(AppConfig.STORAGE_KEYS.TOKEN) || "") : "",
          payload: payload
        };

        try {
          // Menggunakan text/plain agar browser tidak mengirim OPTIONS preflight ke Google Apps Script
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(body),
            redirect: "follow",
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (!response.ok) {
            throw new Error(`HTTP Error ${response.status}`);
          }

          const json = await response.json();

          // Otomatis logout jika token expired (401)
          if (json.code === 401 && useAuth) {
            Store.clearSession();
          }

          return json;
        } catch (err) {
          clearTimeout(timeoutId);
          const isTimeout = err.name === "AbortError";
          return {
            success: false,
            code: isTimeout ? 408 : 500,
            message: isTimeout
              ? "Koneksi ke server timeout (melebihi 15 detik). Periksa jaringan atau status Apps Script."
              : "Gagal terhubung ke server API: " + err.message
          };
        }
      }
    };

    const Store = {
      state: {
        apiConnected: false,
        dbInitialized: false,
        publicTab: "beranda",
        adminMenu: "dashboard",
        user: null,
        bootstrap: {
          settings: {
            event_name: "BOASH CHAMPIONSHIP HUB 2026",
            organizer_name: "SMP BOASH",
            tagline: "One Spirit, Three Competitions, One Champion!",
            registration_open: "TRUE"
          },
          stats: {
            totalSchools: 0,
            totalApprovedTeams: 0,
            futsalCount: 0,
            badmintonCount: 0,
            hadrohCount: 0,
            liveMatches: 0,
            finishedMatches: 0
          },
          master: {
            badmintonCategories: [],
            hadrohCriteria: []
          }
        },
        portalData: {
          futsal: { teams: [], topScorers: [], standings: [], matches: [] },
          badminton: { categories: [], participants: [], standings: [], matches: [] },
          hadroh: { groups: [], criteria: [], resultsPublished: false, leaderboard: [], schedules: [] },
          schedules: [],
          results: [],
          announcements: [],
          champions: []
        },
        filters: {
          futsalSubTab: "teams",
          badmintonKategori: "ALL",
          jadwalCabang: "ALL",
          jadwalStatus: "ALL",
          jadwalTanggal: "",
          jadwalLapangan: "ALL",
          jadwalSearch: "",
          hasilCabang: "ALL",
          hasilSearch: "",
          pengumumanKategori: "ALL"
        },
        adminSummary: null
      },

      initSessionFromStorage() {
        const rawUser = localStorage.getItem(AppConfig.STORAGE_KEYS.USER);
        const token = localStorage.getItem(AppConfig.STORAGE_KEYS.TOKEN);
        if (rawUser && token) {
          try {
            this.state.user = JSON.parse(rawUser);
          } catch (e) {
            this.clearSession();
          }
        }
      },

      setSession(token, userObj) {
        localStorage.setItem(AppConfig.STORAGE_KEYS.TOKEN, token);
        localStorage.setItem(AppConfig.STORAGE_KEYS.USER, JSON.stringify(userObj));
        this.state.user = userObj;
      },

      clearSession() {
        localStorage.removeItem(AppConfig.STORAGE_KEYS.TOKEN);
        localStorage.removeItem(AppConfig.STORAGE_KEYS.USER);
        this.state.user = null;
        this.state.adminSummary = null;
      },

      hasPermission(permCode) {

      renderPublicJadwal() {
        const schedules = Store.state.portalData.schedules;
        const f = Store.state.filters;

        // Daftar unik lapangan untuk dropdown filter
        const venues = [...new Set(schedules.map(s => s.lapangan).filter(v => v && v !== "-"))];

        const filtered = schedules.filter(m => {
          if (f.jadwalCabang !== "ALL" && m.cabang !== f.jadwalCabang) return false;
          if (f.jadwalStatus !== "ALL" && m.status !== f.jadwalStatus) return false;
          if (f.jadwalTanggal && m.tanggal !== f.jadwalTanggal) return false;
          if (f.jadwalLapangan !== "ALL" && m.lapangan !== f.jadwalLapangan) return false;

                      <div class="p-3 rounded-3 bg-dark bg-opacity-50 border border-info border-opacity-25 text-center">
                        <div class="font-athletic display-4 fw-bold text-warning">${stats.badmintonCount}</div>
                        <div class="text-uppercase small fw-bold text-info">Peserta Badminton</div>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="p-3 rounded-3 bg-dark bg-opacity-50 border border-info border-opacity-25 text-center">
                        <div class="font-athletic display-4 fw-bold text-warning">${stats.hadrohCount}</div>
                        <div class="text-uppercase small fw-bold text-info">Grup Hadroh</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-lg-4">
                <div class="display-panel h-100">
                  <h3 class="font-athletic text-warning border-bottom border-secondary pb-2 mb-3">
                    <i class="bi bi-megaphone-fill me-2"></i>Pengumuman Resmi
                  </h3>
                  <div class="p-3 rounded-3 bg-dark bg-opacity-50 mb-3">
                    <div class="fw-bold text-info mb-1">Selamat Datang di SMP BOASH</div>
                    <p class="small text-light opacity-75 mb-0">
                      Seluruh official dan peserta dimohon melakukan QR Code Check-In di meja registrasi minimal 45 menit sebelum jadwal bertanding.
                    </p>
                  </div>
                  <a href="?" class="btn btn-outline-light btn-sm mt-2">
                    <i class="bi bi-box-arrow-left me-1"></i> Keluar Display Mode
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById("appRoot").innerHTML = html;
      }
    };

    /**
     * ============================================================================
     * APPLICATION CONTROLLER
     * ============================================================================
     */
    const App = {
      async init() {
        Store.initSessionFromStorage();
        this.bindEvents();
        Views.render();

        // Uji koneksi dan muat bootstrap data jika API URL sudah terisi
        if (AppConfig.getApiUrl()) {
          await this.refreshConnectionAndData();
        }

        // Jalankan jam & auto-refresh jika berada di Display Mode
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("page") === "display") {
          setInterval(() => {
            const clockEl = document.getElementById("displayClock");
            if (clockEl) {
              clockEl.textContent = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            }
          }, 1000);
          setInterval(() => this.refreshConnectionAndData(), 30000);
        }
      },

      bindEvents() {
        // Form Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("loginUsername").value;
          const password = document.getElementById("loginPassword").value;
          const alertEl = document.getElementById("loginErrorAlert");
          const btn = document.getElementById("btnLoginSubmit");

          alertEl.classList.add("d-none");
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Memverifikasi...`;

          const res = await ApiClient.request("authLogin", { username, password }, false);
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Dashboard`;

          if (!res.success) {
            alertEl.textContent = res.message;
            alertEl.classList.remove("d-none");
            return;
          }

          Store.setSession(res.data.token, res.data.user);
          bootstrap.Modal.getInstance(document.getElementById("loginModal")).hide();
          document.getElementById("loginForm").reset();
          Utils.showToast(res.message, "success");
          this.goToAdmin();
        });

        // Simpan API URL
        document.getElementById("btnSaveApiUrl").addEventListener("click", async () => {
          const url = document.getElementById("inputApiUrl").value.trim();
          const statusEl = document.getElementById("apiConfigStatus");
          if (!url) {
            statusEl.innerHTML = `<span class="text-danger">Masukkan URL Web App terlebih dahulu.</span>`;
            return;
          }
          AppConfig.setApiUrl(url);
          statusEl.innerHTML = `<span class="text-primary">Menguji koneksi ke server...</span>`;
          await this.refreshConnectionAndData();

          if (Store.state.apiConnected) {
            statusEl.innerHTML = `<span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i>Terhubung! Database siap: ${Store.state.dbInitialized ? "Ya (27 Sheet)" : "Belum diinisialisasi"}</span>`;
          } else {
            statusEl.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i>Gagal terhubung. Pastikan deployment Apps Script berizin 'Anyone'.</span>`;
          }
        });

        // Tombol Init 27 Sheet dari Modal Setup
        document.getElementById("btnRunInitDbPublic").addEventListener("click", async () => {
          await this.triggerInitDatabase(Boolean(Store.state.user));
        });
      },

      async refreshConnectionAndData() {
        const pingRes = await ApiClient.request("ping", {}, false);
        Store.state.apiConnected = Boolean(pingRes.success);
        Store.state.dbInitialized = Boolean(pingRes.data && pingRes.data.databaseInitialized);

        if (Store.state.apiConnected && Store.state.dbInitialized) {
          const [bootRes, portalRes] = await Promise.all([
            ApiClient.request("getPublicBootstrap", {}, false),
            ApiClient.request("getPublicPortalData", {}, false)
          ]);
          if (bootRes.success && bootRes.data) {
            Store.state.bootstrap = bootRes.data;
          }
          if (portalRes.success && portalRes.data) {
            Store.state.portalData = portalRes.data;
          }
        }

        if (Store.state.user && window.location.hash.startsWith("#admin")) {
          await this.loadAdminSummary();
        } else {
          Views.render();
        }
      },

      async triggerInitDatabase(useAuth) {
        const statusEl = document.getElementById("apiConfigStatus");
        if (statusEl) statusEl.innerHTML = `<span class="text-primary">Membangun 27 sheet database...</span>`;

        const res = await ApiClient.request("initDatabase", {}, useAuth);
        if (res.success) {
          Utils.showToast("27 Sheet Database berhasil diinisialisasi!", "success");
          if (statusEl) {
            statusEl.innerHTML = `<span class="text-success fw-bold">Sukses! ${res.data.totalSheetsRequired} sheet terverifikasi.</span>`;
          }
          await this.refreshConnectionAndData();
        } else {
          Utils.showToast(res.message, "danger");
          if (statusEl) statusEl.innerHTML = `<span class="text-danger">${Utils.escapeHTML(res.message)}</span>`;
        }
      },

      async loadAdminSummary() {
        const res = await ApiClient.request("getAdminDashboardSummary", {}, true);
        if (res.success) {
          Store.state.adminSummary = res.data;
        } else {
          Utils.showToast(res.message, "warning");
        }
        Views.renderAdminDashboard();
      },

      openApiConfigModal() {
        document.getElementById("inputApiUrl").value = AppConfig.getApiUrl();
        document.getElementById("apiConfigStatus").innerHTML = "";
        new bootstrap.Modal(document.getElementById("apiConfigModal")).show();
      },

      navigatePublic(tab) {
        Store.state.publicTab = tab;
        window.location.hash = tab;
        Views.renderPublicPortal();
        window.scrollTo({ top: 0, behavior: "smooth" });
      },

      setPublicFilter(key, value) {
        Store.state.filters[key] = value;
        Views.renderPublicPortal();
      },

      resetScheduleFilters() {
        Store.state.filters.jadwalCabang = "ALL";
        Store.state.filters.jadwalStatus = "ALL";
        Store.state.filters.jadwalTanggal = "";
        Store.state.filters.jadwalLapangan = "ALL";
        Store.state.filters.jadwalSearch = "";
        Views.renderPublicPortal();
      },

      openAnnouncementModal(pengumumanId) {
        const item = Store.state.portalData.announcements.find(a => a.pengumuman_id === pengumumanId);
        if (!item) return;
        document.getElementById("annModalBadge").textContent = item.kategori || "UMUM";
        document.getElementById("annModalTitle").textContent = item.judul || "";
        document.getElementById("annModalDate").textContent = "Dipublikasikan: " + String(item.published_at || "").replace("T", " ").substring(0, 16);
        document.getElementById("annModalBody").textContent = item.konten || item.ringkasan || "";
        new bootstrap.Modal(document.getElementById("announcementDetailModal")).show();
      },

      goToAdmin() {
        if (!Store.state.user) return;
        window.location.hash = "#admin";
        this.loadAdminSummary();
      },

      goToPublic() {
        window.location.hash = "#beranda";
        Store.state.publicTab = "beranda";
        Views.renderPublicPortal();
      },

      selectAdminMenu(menuId) {
        Store.state.adminMenu = menuId;
        Views.renderAdminDashboard();
      },

      async logout() {
        await ApiClient.request("authLogout", {}, true);
        Store.clearSession();
        Utils.showToast("Anda telah keluar dari dashboard.", "primary");
        this.goToPublic();
      }
    };

    document.addEventListener("DOMContentLoaded", () => App.init());
  </script>
</body>
</html>
